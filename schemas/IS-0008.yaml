id: IS-0008
title: "Climate-residual boundary MI distinguishes encoding from weather leak"
scale: boundary
claim_type: formal_model
candidate_principle:
  - Boundary richness driven by climate is not interior encoding
research_question: "After regressing aperture field on climate features, does residual MI with interior remain >0 for feedback controllers but ≈0 for open-loop hygromorphs?"
hypothesis: "If controller uses occupancy, residual I(Z; A|climate) > δ; if open-loop RH-only, residual I ≤ δ."
mechanism: "Partial information / residualisation protocol (P4)"
inputs:
  - climate features
  - interior Z
  - aperture A
outputs:
  - I residual
  - BIR
  - TFE
controls:
  - open-loop RH
  - occupancy feedback
  - shuffled interior labels
measurements:
  - residual MI
  - null shuffle distribution
falsification:
  - If open-loop residual MI also high, residualisation failed
  - If feedback residual MI≈0, no encoding despite motion
uncertainty:
  - feature choice for climate
  - nonstationarity
status: proposed
artifacts:
  - pending P4; P1 CSV climate+aperture columns are prerequisites
p_stage: P4
stamp: 2026-09-23 ~19:07 AEST
